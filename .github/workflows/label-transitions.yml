name: Label transitions

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  enforce-transitions:
    name: Enforce label state machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./.github/scripts/label-transitions.js');
            await run({ github, context });
